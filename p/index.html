function useInView(opts = { threshold: 0.1, rootMargin: "-60px" }) {
    const ref = useRef(null);
    const [visible, setVisible] = useState(false);
    useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, opts);
        obs.observe(el);
        return () => obs.disconnect();
    }, []);
    return [ref, visible];
}

function Toast({ message, type, onClose }) {
    useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
    return (
        <div className={"toast toast-" + type}>
            <div className="flex items-center gap-3">
                <iconify-icon icon={type === "success" ? "lucide:check-circle" : type === "info" ? "lucide:info" : "lucide:alert-circle"} width="20"></iconify-icon>
                <span className="text-sm font-medium">{message}</span>
            </div>
        </div>
    );
}

            setScrolled(window.scrollY > 50);
            const ss = ["home", "about", "skills", "projects", "education", "contact"];

            // If not configured, fallback to mailto immediately
            setLoading(false);
            const subject = encodeURIComponent("Portfolio Inquiry from: " + form.name);
            const body = encodeURIComponent(`Name: ${form.name}\nEmail: ${form.email}\n\nMessage:\n${form.message}`);
            window.location.href = `mailto:baraivicky@outlook.com?subject=${subject}&body=${body}`;
            setToast({ type: "info", message: "Redirecting to your email client..." });
            return;
        }

        // Try EmailJS
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form, EMAILJS_PUBLIC_KEY)
            .then((response) => {
                setLoading(false);
                // If response status is OK but user reports no email, 
                // it's usually a Template Variable mismatch in EmailJS Dashboard.
                setToast({ type: "success", message: "Message sent successfully via EmailJS!" });
                setForm({ name: '', email: '', message: '' });
            }, (error) => {
                // If EmailJS fails (e.g. network error, bad keys), fallback to mailto
                console.error("EmailJS Error:", error);
                setLoading(false);
                
                // Fallback to mailto
                const subject = encodeURIComponent("Portfolio Inquiry from: " + form.name);
                const body = encodeURIComponent(`Name: ${form.name}\nEmail: ${form.email}\n\nMessage:\n${form.message}`);
                window.location.href = `mailto:baraivicky@outlook.com?subject=${subject}&body=${body}`;
                
                setToast({ type: "info", message: "EmailJS failed. Redirecting to email client..." });
            });
    };

    return (
        <section id="contact" className="py-20 sm:py-24 relative" ref={ref}>
            <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-accent-500/5 rounded-full blur-[120px]"></div>
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <div className={"text-center mb-12 sm:mb-16 anim-fade-up " + (vis ? "visible" : "")}>
                    <span className="text-accent-500 font-mono text-sm mr-2">05.</span>
                    <span className="text-sm font-semibold uppercase tracking-widest text-gray-400">Get In Touch</span>
                    <div className="w-16 h-0.5 bg-accent-500 mx-auto mt-4"></div>
                    <p className="text-gray-400 mt-6 max-w-xl mx-auto text-sm sm:text-base">
                        I am currently open to full-time opportunities. Whether you have a question, a project proposal, or just want to say hi, my inbox is always open!
                    </p>
                </div>

                <div className={"glass rounded-2xl p-6 sm:p-10 anim-fade-up d1 " + (vis ? "visible" : "")}>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid sm:grid-cols-2 gap-6">
                            <div className="space-y-2">
                                <label htmlFor="name" className="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    required
                                    value={form.name}
                                    onChange={handleChange}
                                    className="w-full bg-dark-700 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300"
                                    placeholder="your name"
                                />
                            </div>
                            <div className="space-y-2">
                                <label htmlFor="email" className="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Email</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                    value={form.email}
                                    onChange={handleChange}
                                    className="w-full bg-dark-700 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300"
                                    placeholder="your@example.com"
                                />
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label htmlFor="message" className="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Message</label>
                            <textarea
                                id="message"
                                name="message"
                                rows="5"
                                required
                                value={form.message}
                                onChange={handleChange}
                                className="w-full bg-dark-700 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 resize-none"
                                placeholder="Your message here..."
                            ></textarea>
                        </div>
                        <div className="pt-2">
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full sm:w-auto px-8 py-3.5 bg-accent-500 text-white font-semibold rounded-lg hover:bg-accent-600 transition-all duration-300 hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-accent-500/25"
                            >
                                {loading ? (
                                    <>
                                        <div className="spinner"></div>
                                        Sending...
                                    </>
                                ) : (
                                    <>
                                        Send Message
                                        <iconify-icon icon="lucide:send" width="18"></iconify-icon>
                                    </>
                                )}
                            </button>
                        </div>
                    </form>
                </div>
                
                <div className={"mt-10 text-center anim-fade-up d2 " + (vis ? "visible" : "")}>
                    <p className="text-gray-500 text-sm">Or reach out directly via</p>
                    <a href="mailto:baraivicky@outlook.com" className="text-accent-400 hover:text-accent-300 font-medium mt-2 inline-block transition-colors">baraivicky@outlook.com</a>
                </div>
            </div>
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </section>
    );
}

function Footer() {
    return (
        <footer className="py-8 border-t border-white/5 bg-dark-900">
            <div className="max-w-7xl mx-auto px-4 text-center">
                <p className="text-gray-500 text-sm">
                    &copy; {new Date().getFullYear()} Vicky Barai. Built with <span className="text-accent-500">React</span> & <span className="text-accent-500">Tailwind</span>.
                </p>
            </div>
        </footer>
    );
}

function App() {
    return (
        <>
            <Navbar />
            <main>
                <Hero />
                <About />
                <Skills />
                <Projects />
                <Education />
                <Contact />
            </main>
            <Footer />
        </>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
